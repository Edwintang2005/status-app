# Build and test gate for the app. The Pages deploy (static.yml) is separate.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are cancelled mid-flight; on main a run finishes (though a newer
  # push still replaces one that is only queued).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # One DerivedData for every step, so each builds on the last.
      DERIVED_DATA: build/DerivedData
      RESULTS: build/Results
    steps:
      - uses: actions/checkout@v4

      # Held to Xcode 26 (the newest 26.x): warnings are errors, so a new major's
      # diagnostics shouldn't turn main red unasked. Pin exactly if a minor does.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - run: xcodebuild -version

      # Pinned in .xcodegen-version (`make project` checks it too): another
      # XcodeGen version can write a different project and fail the drift check.
      - name: Install XcodeGen
        run: |
          XCODEGEN_VERSION=$(cat .xcodegen-version)
          curl -sSfL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # The project is generated but committed (Xcode Cloud builds from a plain clone).
      - name: Committed project matches project.yml
        run: |
          xcodegen generate
          # `status`, not `diff`: a file XcodeGen adds inside the bundle is untracked.
          if [ -n "$(git status --porcelain -- RedString.xcodeproj)" ]; then
            git status --short -- RedString.xcodeproj
            echo "::error::RedString.xcodeproj is stale — run 'make project' and commit it."
            exit 1
          fi

      - name: Pick a simulator
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Using $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      # Unsigned, warnings as errors. One Debug build: the app, both extensions
      # and the unit tests.
      - name: Build Debug for testing
        run: |
          xcodebuild build-for-testing -project RedString.xcodeproj -scheme RedString \
            -destination "platform=iOS Simulator,name=$SIM" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/build-debug.xcresult"

      - name: Unit tests
        run: |
          xcodebuild test-without-building -project RedString.xcodeproj -scheme RedString \
            -destination "platform=iOS Simulator,name=$SIM" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -only-testing:RedStringTests \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/unit-tests.xcresult"

      # Compiled, not run: the smoke needs a signed app (`make uitest`).
      - name: Build UI tests
        run: |
          xcodebuild build-for-testing -project RedString.xcodeproj -scheme RedStringUITests \
            -destination "platform=iOS Simulator,name=$SIM" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/build-uitests.xcresult"

      # Release too: the #if DEBUG boundaries (demo mode, previews) are
      # otherwise first compiled on archive day.
      - name: Build Release
        run: |
          xcodebuild -project RedString.xcodeproj -scheme RedString \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/build-release.xcresult" build

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/Results
          if-no-files-found: ignore
