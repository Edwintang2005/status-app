# XcodeGen spec — the source of truth for Tether.app.
# Regenerate the Xcode project with:  make project     (or: xcodegen generate)
#
# To rebrand: change `bundleIdPrefix` and the PRODUCT_BUNDLE_IDENTIFIERs below,
# then the matching IDs in Sources/Shared/AppConfig.swift, and re-run `make project`.

name: Tether

options:
  bundleIdPrefix: com.edwintang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Language mode 5 under the Swift 6 compiler: strict-concurrency problems
    # surface as warnings rather than hard errors.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set this to your 10-character Apple Developer Team ID, or just pick your
    # team once in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Lets `make preview` compile out CloudKit (see CloudSync.init).
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(TETHER_CONDITIONS)

targets:
  Tether:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
        excludes:
          - "Resources/Info.plist"
          - "Resources/Tether.entitlements"
      - path: Sources/App/Resources/Info.plist
        buildPhase: none
      - path: Sources/App/Resources/Tether.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwintang.tether
        PRODUCT_NAME: Tether
        INFOPLIST_FILE: Sources/App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/Tether.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TetherWidgetExtension
        embed: true
        codeSign: true

  TetherWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
        excludes:
          - "Resources/Info.plist"
          - "Resources/TetherWidget.entitlements"
      - path: Sources/Widget/Resources/Info.plist
        buildPhase: none
      - path: Sources/Widget/Resources/TetherWidget.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwintang.tether.widget
        PRODUCT_NAME: TetherWidgetExtension
        INFOPLIST_FILE: Sources/Widget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/Resources/TetherWidget.entitlements

schemes:
  Tether:
    build:
      targets:
        Tether: all
        TetherWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
