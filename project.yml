# XcodeGen spec — the source of truth for Red String.app.
# Regenerate the Xcode project with:  make project     (or: xcodegen generate)
#
# To rebrand: change `bundleIdPrefix` and the PRODUCT_BUNDLE_IDENTIFIERs below,
# then the matching IDs in Sources/Shared/AppConfig.swift, the four
# .entitlements files (app Debug + Release, widget, NSE) and the NSUbiquitousContainers key in
# Sources/App/Resources/Info.plist, and re-run `make project`.

name: RedString

options:
  bundleIdPrefix: com.edwintang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Version lives here, not in Xcode's UI: `make build`/`make device` run
    # xcodegen first, which regenerates the project and overwrites anything
    # set in Xcode. Build numbers stay monotonic across marketing versions —
    # 1.0 shipped up to build 5, so 1.1 starts at 6.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "7"
    # Language mode 5 under the Swift 6 compiler: strict-concurrency problems
    # surface as warnings rather than hard errors.
    SWIFT_VERSION: "5.0"
    # iPhone only. Repeated on every target below, and that is not redundant:
    # XcodeGen's per-target setting presets write TARGETED_DEVICE_FAMILY =
    # "1,2", and a target-level value beats this project-level one. Left only
    # here, the archive silently claims iPad support and App Store Connect
    # rejects it (error 90474) for not declaring all four iPad orientations.
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Must live here, not just in Xcode's Signing & Capabilities tab: the
    # .xcodeproj is generated, so `make project` overwrites whatever the UI
    # set. Team IDs aren't secret.
    DEVELOPMENT_TEAM: "3L8Q3U3WY3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Each target keeps its own Localizable.xcstrings under Resources/; the
    # build fills them from SwiftUI text, LocalizedStringResource and String(localized:).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # dSYMs for every archive, so TestFlight and App Store crash reports come
    # back symbolicated rather than as raw addresses.
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  # Set per-configuration, NOT in `base`: a base-level override replaces
  # Xcode's built-in Debug value instead of adding to it, which silently
  # strips DEBUG and compiles out every #if DEBUG block — previews included.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:
  RedString:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
        excludes:
          - "Resources/Info.plist"
          - "Resources/RedString.entitlements"
          - "Resources/RedString-Release.entitlements"
      - path: Sources/App/Resources/Info.plist
        buildPhase: none
      - path: Sources/App/Resources/RedString.entitlements
        buildPhase: none
      - path: Sources/App/Resources/RedString-Release.entitlements
        buildPhase: none
      # The lock-screen heart's intent, also exposed to Siri/Shortcuts by the app.
      - path: Sources/Widget/SendNudgeIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwintang.redstring
        PRODUCT_NAME: RedString
        # Overrides XcodeGen's "1,2" target preset — see settings.base above.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # aps-environment must be `production` in anything you archive for
      # TestFlight or the App Store, and `development` for Xcode runs.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/RedString.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/RedString-Release.entitlements
    dependencies:
      - target: RedStringWidgetExtension
        embed: true
        codeSign: true
      - target: RedStringNotificationService
        embed: true
        codeSign: true

  RedStringWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
        excludes:
          - "Resources/Info.plist"
          - "Resources/RedStringWidget.entitlements"
      - path: Sources/Widget/Resources/Info.plist
        buildPhase: none
      - path: Sources/Widget/Resources/RedStringWidget.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwintang.redstring.widget
        PRODUCT_NAME: RedStringWidgetExtension
        # Overrides XcodeGen's "1,2" target preset — see settings.base above.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Widget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/Resources/RedStringWidget.entitlements

  # Runs when CloudKit delivers a nudge or moment push, including when the app
  # has been force-quit. See Sources/NotificationService/NotificationService.swift.
  RedStringNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/NotificationService
        excludes:
          - "Resources/Info.plist"
          - "Resources/RedStringNotificationService.entitlements"
      - path: Sources/NotificationService/Resources/Info.plist
        buildPhase: none
      - path: Sources/NotificationService/Resources/RedStringNotificationService.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwintang.redstring.notifications
        PRODUCT_NAME: RedStringNotificationService
        # Overrides XcodeGen's "1,2" target preset — see settings.base above.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/NotificationService/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/NotificationService/Resources/RedStringNotificationService.entitlements

  # Unit tests over Sources/Shared, compiled straight into the bundle — no host
  # app, so no signing and no App Group: the stores under test take injected
  # files or a throwaway UserDefaults suite. App-target logic isn't covered here.
  RedStringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Tests/RedStringTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwintang.redstring.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RedString:
    build:
      targets:
        RedString: all
        RedStringWidgetExtension: all
        RedStringNotificationService: all
        RedStringTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RedStringTests
    archive:
      config: Release
